<div class="dashboard-container">
  <div class="welcome-section">
    <h2>Welcome, {{ userName }}!</h2>
    <p>Here's your team's leave overview</p>
    <button mat-raised-button color="accent" routerLink="/manager/team-leaves">
      <mat-icon>group</mat-icon> View Team Leaves
    </button>
  </div>

  <div class="spinner-container" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="!loading">
    <h3 class="section-title">Team Leave Analytics</h3>
    <div class="analytics-cards">
      <mat-card class="analytics-card pending">
        <mat-card-content>
          <mat-icon>hourglass_empty</mat-icon>
          <h2>{{ analytics.pending }}</h2>
          <p>Pending</p>
        </mat-card-content>
      </mat-card>

      <mat-card class="analytics-card approved">
        <mat-card-content>
          <mat-icon>check_circle</mat-icon>
          <h2>{{ analytics.approved }}</h2>
          <p>Approved</p>
        </mat-card-content>
      </mat-card>

      <mat-card class="analytics-card rejected">
        <mat-card-content>
          <mat-icon>cancel</mat-icon>
          <h2>{{ analytics.rejected }}</h2>
          <p>Rejected</p>
        </mat-card-content>
      </mat-card>

      <mat-card class="analytics-card total">
        <mat-card-content>
          <mat-icon>list_alt</mat-icon>
          <h2>{{ analytics.total }}</h2>
          <p>Total</p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
