<div class="apply-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Apply for Leave</mat-card-title>
      <mat-card-subtitle>Fill in the details below</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="applyForm" (ngSubmit)="onSubmit()">
        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Leave Type</mat-label>
          <mat-select formControlName="leaveTypeId">
            <mat-option *ngFor="let type of leaveTypes" [value]="type.id">
              {{ type.name }} ({{ type.maxDaysPerYear }} days/year)
            </mat-option>
          </mat-select>
          <mat-error *ngIf="applyForm.get('leaveTypeId').hasError('required')">Leave type is required</mat-error>
        </mat-form-field>

        <div class="date-row">
          <mat-form-field appearance="outline">
            <mat-label>Start Date</mat-label>
            <input matInput [matDatepicker]="startPicker" formControlName="startDate" [min]="minDate">
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
            <mat-error *ngIf="applyForm.get('startDate').hasError('required')">Start date is required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>End Date</mat-label>
            <input matInput [matDatepicker]="endPicker" formControlName="endDate" [min]="applyForm.get('startDate').value || minDate">
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
            <mat-error *ngIf="applyForm.get('endDate').hasError('required')">End date is required</mat-error>
          </mat-form-field>
        </div>

        <mat-card class="days-card" *ngIf="totalDays > 0">
          <mat-card-content>
            <p><strong>Working Days: {{ totalDays }}</strong></p>
          </mat-card-content>
        </mat-card>

        <mat-form-field class="full-width" appearance="outline">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="4" placeholder="Enter reason for leave"></textarea>
          <mat-error>{{ getReasonError() }}</mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/employee/dashboard">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading || totalDays === 0">
            <mat-spinner diameter="20" *ngIf="loading" style="display:inline-block; margin-right:8px;"></mat-spinner>
            {{ loading ? 'Submitting...' : 'Submit Application' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
