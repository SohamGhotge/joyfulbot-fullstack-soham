<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <mat-icon class="logo-icon">business</mat-icon>
      <h3>ELMS</h3>
      <p>{{ userName }}</p>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/employee/dashboard" routerLinkActive="active-link">
        <mat-icon matListIcon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/employee/apply-leave" routerLinkActive="active-link">
        <mat-icon matListIcon>add_circle</mat-icon>
        <span>Apply Leave</span>
      </a>
      <a mat-list-item routerLink="/employee/my-leaves" routerLinkActive="active-link">
        <mat-icon matListIcon>list_alt</mat-icon>
        <span>My Leaves</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <button mat-button (click)="logout()" class="logout-btn">
        <mat-icon>exit_to_app</mat-icon>
        Logout
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary">
      <span>Employee Leave Management System</span>
    </mat-toolbar>
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
