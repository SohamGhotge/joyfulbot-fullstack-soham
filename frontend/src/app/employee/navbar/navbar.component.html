<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
      <div class="brand-icon">
        <mat-icon>business_center</mat-icon>
      </div>
      <h3>ELMS</h3>
      <p class="user-name">{{ userName }}</p>
      <span class="role-chip">Employee</span>
    </div>

    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/employee/dashboard" routerLinkActive="active-link">
        <mat-icon matListIcon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/employee/apply-leave" routerLinkActive="active-link">
        <mat-icon matListIcon>add_circle_outline</mat-icon>
        <span>Apply Leave</span>
      </a>
      <a mat-list-item routerLink="/employee/my-leaves" routerLinkActive="active-link">
        <mat-icon matListIcon>assignment</mat-icon>
        <span>My Leaves</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <button mat-button (click)="logout()" class="logout-btn">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
